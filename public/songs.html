        "vibe_match": "Metadata Catalog"
    }
];

        function render() {
            const tbody = document.getElementById('song-table');
            tbody.innerHTML = '';

            // Sort by plays descending
            songs.sort((a, b) => b.plays - a.plays);

            let totalPlays = 0;
            const genreCount = {};

            songs.forEach((song, index) => {
                totalPlays += song.plays;
                genreCount[song.genre] = (genreCount[song.genre] || 0) + song.plays;

                const ytQuery = encodeURIComponent(`${song.title} ${song.artist}`);
                const ytLink = `https://music.youtube.com/search?q=${ytQuery}`;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${song.title}</strong></td>
                    <td>${song.artist}</td>
                    <td><span class="genre-badge">${song.genre}</span></td>
                    <td class="play-count">${song.plays}</td>
                    <td><a href="${ytLink}" target="_blank" class="song-link">▶ YouTube Music</a></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('total-songs').innerText = songs.length;
            document.getElementById('total-plays').innerText = totalPlays.toLocaleString();

            const topGenre = Object.keys(genreCount).length > 0
                ? Object.keys(genreCount).reduce((a, b) => genreCount[a] > genreCount[b] ? a : b)
                : '-';
            document.getElementById('top-genre').innerText = topGenre;
        }

        render();
    </script>
