<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backlink Broadcast | System Manual</title>
    <!-- Modern Typography -->
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e0e0e0;
            --accent-cyan: #00ffcc;
            --accent-magenta: #ff00ff;
            --border-color: #333;
            --code-bg: #111;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }

        /* --- Layout --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-magenta);
            padding-bottom: 1rem;
            margin-bottom: 3rem;
        }

        header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        nav a {
            color: #666;
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            margin-left: 20px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: white;
        }

        /* --- Markdown Styles --- */
        #content {
            font-size: 1rem;
        }

        #content h1,
        #content h2,
        #content h3 {
            font-family: 'Space Mono', monospace;
            color: white;
            margin-top: 2.5rem;
        }

        #content h1 {
            font-size: 2.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: var(--accent-cyan);
        }

        #content h2 {
            font-size: 1.6rem;
            color: var(--accent-magenta);
        }

        #content a {
            color: var(--accent-cyan);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-cyan);
        }

        #content a:hover {
            color: white;
            border-bottom-style: solid;
        }

        #content code {
            font-family: 'Space Mono', monospace;
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            color: #ff79c6;
            font-size: 0.9em;
        }

        #content pre {
            background: var(--code-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        #content pre code {
            background: none;
            padding: 0;
            color: #f8f8f2;
        }

        #content blockquote {
            border-left: 4px solid var(--accent-magenta);
            margin: 0;
            padding-left: 1.5rem;
            color: #999;
            font-style: italic;
        }

        #content ul,
        #content ol {
            padding-left: 2rem;
        }

        #content li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>System Manual</h1>
            <nav>
                <a href="index.html">HOME</a>
                <a href="songs.html">LIBRARY</a>
            </nav>
        </header>

        <div id="content">Loading documentation...</div>
    </div>

    <script>
        fetch('manual.md')
            .then(response => {
                if (!response.ok) throw new Error("Documentation not found.");
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<p style="color:red; font-family:'Space Mono'">ERROR: ${err.message}</p>`;
            });
    </script>
</body>

</html>
