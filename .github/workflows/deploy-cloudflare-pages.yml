name: Deploy Docs to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: fuzzywigg/project-template/.github/workflows/reusable-pages-static.yml@main
    with:
      project_name: radio-pappas-work
      output_dir: 'site'
      build_command: 'python -m pip install --upgrade pip && python -m pip install mkdocs-material && mkdocs build --site-dir site'
      production_branch: 'main'
    secrets:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
