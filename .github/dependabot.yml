version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      security-updates:
        patterns:
          - "cryptography"
          - "urllib3"
          - "certifi"
          - "idna"
          - "python-multipart"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Cognee has a frequently-breaking API; skip major version bumps until the API stabilizes.
      # Minor and patch updates are still applied automatically.
      - dependency-name: "cognee"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
